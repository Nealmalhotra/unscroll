name: Unscroll
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
# Team ID, bundle ID prefix and App Group come from Config/Local.xcconfig (see README).
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
packages:
  UnscrollKit:
    path: Packages/UnscrollKit

targets:
  Unscroll:
    type: application
    platform: iOS
    sources: [App/Sources, App/Resources]
    dependencies:
      - package: UnscrollKit
        product: UnscrollKit
      - package: UnscrollKit
        product: UnscrollScreenTime
      - target: UnscrollMonitor
      - target: UnscrollShieldConfiguration
      - target: UnscrollShieldAction
      - target: UnscrollReport
      - target: UnscrollWidget
    entitlements:
      path: App/Unscroll.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [$(APP_GROUP)]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Unscroll
        UnscrollAppGroup: $(APP_GROUP)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: $(BUNDLE_ID_PREFIX)
            CFBundleURLSchemes: [unscroll]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  UnscrollMonitor:
    type: app-extension
    platform: iOS
    sources: [Extensions/Monitor]
    dependencies:
      - package: UnscrollKit
        product: UnscrollKit
      - package: UnscrollKit
        product: UnscrollScreenTime
    entitlements:
      path: Extensions/Monitor/Monitor.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [$(APP_GROUP)]
    info:
      path: Extensions/Monitor/Info.plist
      properties:
        CFBundleDisplayName: Unscroll Monitor
        UnscrollAppGroup: $(APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).MonitorExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).app.monitor

  UnscrollShieldConfiguration:
    type: app-extension
    platform: iOS
    sources: [Extensions/ShieldConfiguration]
    dependencies:
      - package: UnscrollKit
        product: UnscrollKit
      - package: UnscrollKit
        product: UnscrollScreenTime
    entitlements:
      path: Extensions/ShieldConfiguration/ShieldConfiguration.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [$(APP_GROUP)]
    info:
      path: Extensions/ShieldConfiguration/Info.plist
      properties:
        CFBundleDisplayName: Unscroll Shield
        UnscrollAppGroup: $(APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettingsUI.shield-configuration-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldConfigurationExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).app.shieldconfiguration

  UnscrollShieldAction:
    type: app-extension
    platform: iOS
    sources: [Extensions/ShieldAction]
    dependencies:
      - package: UnscrollKit
        product: UnscrollKit
      - package: UnscrollKit
        product: UnscrollScreenTime
    entitlements:
      path: Extensions/ShieldAction/ShieldAction.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [$(APP_GROUP)]
    info:
      path: Extensions/ShieldAction/Info.plist
      properties:
        CFBundleDisplayName: Unscroll Shield Action
        UnscrollAppGroup: $(APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettings.shield-action-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldActionExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).app.shieldaction

  UnscrollReport:
    type: extensionkit-extension
    platform: iOS
    sources: [Extensions/Report]
    dependencies:
      - package: UnscrollKit
        product: UnscrollKit
    entitlements:
      path: Extensions/Report/Report.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [$(APP_GROUP)]
    info:
      path: Extensions/Report/Info.plist
      properties:
        CFBundleDisplayName: Unscroll Report
        UnscrollAppGroup: $(APP_GROUP)
        EXAppExtensionAttributes:
          EXExtensionPointIdentifier: com.apple.deviceactivityui.report-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).app.report
        # Apple's DeviceActivityReportScene isn't Swift 6 concurrency-clean yet.
        SWIFT_VERSION: "5.0"

  UnscrollWidget:
    type: app-extension
    platform: iOS
    sources: [Extensions/Widget]
    dependencies:
      - package: UnscrollKit
        product: UnscrollKit
    entitlements:
      path: Extensions/Widget/Widget.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP)]
    info:
      path: Extensions/Widget/Info.plist
      properties:
        CFBundleDisplayName: Unscroll Widget
        UnscrollAppGroup: $(APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).app.widget

schemes:
  Unscroll:
    build:
      targets:
        Unscroll: all
    run:
      config: Debug
